services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    ports:
      - "1884:1883"
      - "9002:9001"
    volumes:
      - ./mqtt-broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smartward_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_ward}
      MYSQL_USER: ${MYSQL_USER:-smart_ward}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smartward_pass}
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./cloud-backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  cloud-backend:
    build: ./cloud-backend
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-smart_ward}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smartward_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_ward}
      MQTT_BROKER: mqtt-broker
      MQTT_PORT: "1883"
    ports:
      - "8001:8000"
    depends_on:
      mysql:
        condition: service_healthy
      mqtt-broker:
        condition: service_started
    restart: unless-stopped

  training-coordinator:
    build: ./training-coordinator
    ports:
      - "8002:8000"
    restart: unless-stopped

  cloud-llm-service:
    build: ./cloud-llm-service
    ports:
      - "8004:8004"
    environment:
      LLM_MODE: ${LLM_MODE:-mock}
      MQTT_BROKER: mqtt-broker
      MQTT_PORT: "1883"
      VLLM_ENDPOINT: ${VLLM_ENDPOINT:-http://localhost:8000/v1/completions}
    depends_on:
      - mqtt-broker
    restart: unless-stopped

  diffusion-service:
    build: ./diffusion-service
    ports:
      - "8003:8003"
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - HF_HUB_DISABLE_XET=1
    volumes:
      - diffusion-models:/app/models
      - diffusion-output:/app/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  cloud-frontend:
    build: ./cloud-frontend
    ports:
      - "8081:80"
    depends_on:
      - cloud-backend
      - training-coordinator
    restart: unless-stopped

  edge-bed-01:
    build:
      context: ./edge-agent
      args:
        INSTALL_YOLO: ${INSTALL_YOLO:-false}
    environment: &edge-environment
      WARD_ID: W-01
      BED_ID: B01
      EDGE_NODE_ID: EDGE-W01-B01
      MQTT_BROKER: mqtt-broker
      MQTT_PORT: 1883
      TICK_SECONDS: ${TICK_SECONDS:-15}
      EVENT_DEDUPE_SECONDS: ${EVENT_DEDUPE_SECONDS:-60}
      CAMERA_MODE: ${CAMERA_MODE:-mock}
      CAMERA_SOURCE: ${CAMERA_SOURCE:-0}
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-/app/models/yolo11n-pose.pt}
      YOLO_DEVICE: ${YOLO_DEVICE:-}
      YOLO_CONFIDENCE: ${YOLO_CONFIDENCE:-0.35}
      YOLO_TRACKER_IOU: ${YOLO_TRACKER_IOU:-0.3}
      YOLO_TRACKER_MAX_MISSED: ${YOLO_TRACKER_MAX_MISSED:-8}
      BEHAVIOR_HISTORY_SIZE: ${BEHAVIOR_HISTORY_SIZE:-24}
      YOLO_SAVE_EVIDENCE: ${YOLO_SAVE_EVIDENCE:-false}
      EVIDENCE_DIR: ${EVIDENCE_DIR:-/app/evidence}
      # 默认使用 mock；设置 LLM_MODE=real 后加载宿主机挂载的 GGUF 模型
      LLM_MODE: ${LLM_MODE:-mock}
      LLM_PROFILE: ${LLM_PROFILE:-quality}
      LLM_MODEL_PATH: ${LLM_MODEL_PATH:-/app/models/qwen2.5-1.5b-gguf/qwen2.5-1.5b-instruct-q4_k_m.gguf}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-qwen2.5-1.5b-instruct}
      LLM_MODEL_VERSION: ${LLM_MODEL_VERSION:-1.0.0-int4}
      LLM_N_CTX: ${LLM_N_CTX:-512}
      LLM_N_BATCH: ${LLM_N_BATCH:-128}
      LLM_N_UBATCH: ${LLM_N_UBATCH:-128}
      LLM_N_THREADS: ${LLM_N_THREADS:-8}
      LLM_N_THREADS_BATCH: ${LLM_N_THREADS_BATCH:-8}
      LLM_USE_MMAP: ${LLM_USE_MMAP:-true}
      LLM_USE_MLOCK: ${LLM_USE_MLOCK:-false}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-64}
      # B01 由宿主机摄像头脚本实时检测，避免与 mock 跌倒事件重复上报
      SCENARIO_PROFILE: ""
    volumes:
      - edge-b01-data:/app/data
      - ./edge-agent/models:/app/models:ro
    depends_on:
      - mqtt-broker
    restart: unless-stopped

  edge-bed-02:
    build:
      context: ./edge-agent
      args:
        INSTALL_YOLO: ${INSTALL_YOLO:-false}
    environment:
      <<: *edge-environment
      BED_ID: B02
      EDGE_NODE_ID: EDGE-W01-B02
      SCENARIO_PROFILE: bed_leave,night_wandering,long_still,bedsore_risk
    volumes:
      - edge-b02-data:/app/data
      - ./edge-agent/models:/app/models:ro
    depends_on:
      - mqtt-broker
    restart: unless-stopped

  edge-bed-03:
    build:
      context: ./edge-agent
      args:
        INSTALL_YOLO: ${INSTALL_YOLO:-false}
    environment:
      <<: *edge-environment
      BED_ID: B03
      EDGE_NODE_ID: EDGE-W01-B03
      SCENARIO_PROFILE: environment_anomaly,door_departure,abnormal_posture,device_fault
    volumes:
      - edge-b03-data:/app/data
      - ./edge-agent/models:/app/models:ro
    depends_on:
      - mqtt-broker
    restart: unless-stopped

volumes:
  mqtt-data:
  mysql-data:
  edge-b01-data:
  edge-b02-data:
  edge-b03-data:
  diffusion-models:
  diffusion-output:

